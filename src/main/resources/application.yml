server:
  port: 80
  max-http-request-header-size: 16KB
  # 임의 X-Forwarded-* 값으로 요청자 주소를 위조하지 못하게 기본 비활성화한다.
  # 환경자료 rate limit은 아래 trusted-proxy-cidrs에 명시된 peer의
  # CF-Connecting-IP만 별도로 신뢰한다.
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/geo+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 16KB
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  web:
    resources:
      static-locations: classpath:/static/

# 기상청 API Hub 설정
kma:
  api:
    base-url: https://apihub.kma.go.kr
    auth-key: ${KMA_API_AUTH_KEY:}     # 발급: https://apihub.kma.go.kr

# 애플리케이션 런타임 설정
weather-grid:
  map:
    # VWorld 키는 서버의 동일 출처 타일 프록시에서만 사용하고 브라우저에는 노출하지 않는다.
    # 운영 환경 변수로 주입하며, 없으면 OSM 도로지도로 대체한다.
    vworld-api-key: ${VWORLD_API_KEY:}
  upstream:
    # 두 키는 URL 인코딩 전 원문을 운영 환경변수로만 주입한다.
    public-data:
      base-url: https://apis.data.go.kr
      credential: ${DATA_GO_KR_SERVICE_KEY:}
    traffic-cctv:
      base-url: https://openapi.its.go.kr:9443/cctvInfo
      credential: ${ITS_API_KEY:}
  cache:
    path: ${WEATHER_GRID_CACHE_PATH:${java.io.tmpdir}/korea-weather-grid}  # 검증된 원문은 {path}/grid-v2 아래에만 저장
    retention-days: ${WEATHER_GRID_CACHE_RETENTION_DAYS:14}  # UTC 날짜 기준으로 오래된 실행시각 디렉터리 정리
  grid:
    step: 1        # 표출 다운샘플 간격 (1=5km 원해상도, 렌더 부하 시 2·4)
  request-budget:
    public-per-minute: ${WEATHER_GRID_ENV_REQUESTS_PER_MINUTE:60}
    maximum-client-buckets: ${WEATHER_GRID_ENV_RATE_LIMIT_MAX_CLIENTS:10000}
    point-forecast-per-minute: ${WEATHER_GRID_FORECAST_REFRESHES_PER_MINUTE:20}
    air-per-hour: ${WEATHER_GRID_AIR_REFRESHES_PER_HOUR:2}
    traffic-cameras-per-minute: ${WEATHER_GRID_CCTV_REFRESHES_PER_MINUTE:30}
    # 직접 연결 peer가 이 CIDR 안일 때만 CF-Connecting-IP를 사용한다.
    # 프록시는 외부에서 들어온 동일 이름 헤더를 반드시 제거/덮어써야 한다.
    trusted-proxy-cidrs: ${WEATHER_GRID_TRUSTED_PROXY_CIDRS:}
  demo-mode: ${WEATHER_GRID_DEMO_MODE:false}  # 운영 기본값 false; 합성 자료는 로컬 데모에서만 명시 허용

logging:
  level:
    io.github.easygap.weathergrid: INFO
    root: INFO
