name: 품질 게이트

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: 단위 테스트 · Worker 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Java 17 준비
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비 및 Wrapper 검증
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Node.js 22 준비
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            e2e/package-lock.json

      - name: Spring 테스트
        run: ./gradlew test --no-daemon

      - name: Node 의존성 설치
        run: |
          npm ci --prefix cloudflare
          npm ci --prefix e2e

      - name: Worker 테스트와 의존성 감사
        run: |
          npm test --prefix cloudflare
          npm audit --prefix cloudflare --audit-level=high
          npm audit --prefix e2e --audit-level=high

      - name: Cloudflare 빌드 및 dry-run
        working-directory: cloudflare
        run: |
          npm run build
          npx wrangler deploy --dry-run

  browser-regression:
    name: 브라우저 회귀
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Java 17 준비
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비 및 Wrapper 검증
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6

      - name: Node.js 22 준비
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright 설치
        run: |
          npm ci --prefix e2e
          cd e2e
          npx playwright install --with-deps chromium

      - name: 로컬 서버와 브라우저 회귀 테스트
        shell: bash
        env:
          WEATHER_GRID_DEMO_MODE: 'true'
          WEATHER_GRID_CACHE_PATH: ${{ runner.temp }}/korea-weather-grid
        run: |
          set -euo pipefail
          mkdir -p build
          ./gradlew bootRun --args='--server.port=8095' --no-daemon > build/ci-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=false
          for _ in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8095/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat build/ci-server.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat build/ci-server.log
            exit 1
          fi

          WEATHER_GRID_BASE=http://127.0.0.1:8095 npm test --prefix e2e

      - name: 실패 자료 업로드
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-regression-failure
          path: |
            build/ci-server.log
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
