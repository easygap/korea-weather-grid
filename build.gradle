plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.easygap'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 관리 버전에 포함된 공개 취약점 패치가 반영될 때까지 안전한 버전으로 고정한다.
ext['jackson-bom.version'] = '3.1.5'
ext['netty.version'] = '4.2.16.Final'

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JSP 지원
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // WebClient (기상청 API 호출)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

// 개인 로컬 키 파일은 소스 트리에 존재하더라도 JAR/WAR에 절대 포함하지 않는다.
tasks.named('processResources') {
    exclude 'application-local.yml'
}

// 로컬 개발 실행에서만 gitignored 설정을 외부 파일로 읽는다.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', 'local'
    def demoModeProperty = System.getProperty('weather-grid.demo-mode')
    if (demoModeProperty != null) {
        systemProperty 'weather-grid.demo-mode', demoModeProperty
    } else {
        environment 'WEATHER_GRID_DEMO_MODE',
                System.getenv().getOrDefault('WEATHER_GRID_DEMO_MODE', 'true')
    }
    systemProperty 'spring.config.additional-location',
            "optional:file:${projectDir}/src/main/resources/application-local.yml"
}
